name: Pull Request Trusted Governance

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    concurrency:
      group: pull-request-trusted-governance-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Check out trusted base
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Materialize candidate governance snapshot
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/pull-request-trusted-governance-candidate"
          candidate_sha="${{ github.event.pull_request.head.sha }}"
          pr_ref="refs/remotes/origin/pull/${{ github.event.pull_request.number }}/head"
          rm -rf "$candidate_root"
          mkdir -p "$candidate_root"
          git fetch --no-tags --depth=1 origin "+refs/pull/${{ github.event.pull_request.number }}/head:$pr_ref"
          if [ "$(git rev-parse "$pr_ref")" != "$candidate_sha" ]; then
            echo "Trusted governance snapshot head drifted from the event payload." >&2
            exit 1
          fi
          while IFS= read -r relative_path; do
            mkdir -p "$candidate_root/$(dirname "$relative_path")"
            git show "$candidate_sha:$relative_path" > "$candidate_root/$relative_path"
          done <<'EOF'
          .github/PULL_REQUEST_TEMPLATE.md
          .github/CODEOWNERS
          .github/workflows/deploy-pages.yml
          .github/workflows/publish-problem9-devbox-image.yml
          .github/workflows/publish-worker-image.yml
          .github/workflows/pull-request-ci.yml
          .github/workflows/pull-request-trusted-governance.yml
          docs/project-management.md
          docs/runtime-env-mode-checklists.md
          docs/runtime.md
          infra/README.md
          package.json
          EOF
          echo "CANDIDATE_REPO_ROOT=$candidate_root" >> "$GITHUB_ENV"

      - name: Check PR governance body
        run: node infra/scripts/check-pr-governance-body.mjs --repo-root "$CANDIDATE_REPO_ROOT" --event-json "$GITHUB_EVENT_PATH"

      - name: Check deployment workflow Node runtimes
        run: node infra/scripts/check-deployment-workflow-node-runtime.mjs --repo-root "$CANDIDATE_REPO_ROOT"

      - name: Check main-branch promotion gate policy
        run: node infra/scripts/check-main-branch-promotion-gate.mjs --repo-root "$CANDIDATE_REPO_ROOT"
